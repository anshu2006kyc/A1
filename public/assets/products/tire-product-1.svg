    <g stroke="#6ee7b7" stroke-width="6" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-44"/>
      <line x1="0" y1="0" x2="42" y2="-14"/>
      <line x1="0" y1="0" x2="26" y2="36"/>
      <line x1="0" y1="0" x2="-26" y2="36"/>
