      <circle cx="0" cy="86" r="5"/>
      <circle cx="-86" cy="0" r="5"/>
      <circle cx="86" cy="0" r="5"/>
      <circle cx="-61" cy="-61" r="5"/>
      <circle cx="61" cy="61" r="5"/>
      <circle cx="-61" cy="61" r="5"/>
      <circle cx="61" cy="-61" r="5"/>
    </g>
    <!-- Central Titanium Biometric Dial -->
    <circle cx="0" cy="0" r="68" fill="#292524" stroke="#eab308" stroke-width="3"/>
